services:
  i2pd:
    image: purplei2p/i2pd:${I2PD_IMAGE_TAG:-latest}
    restart: unless-stopped
    command:
      - "--http.enabled=true"
      - "--http.address=0.0.0.0"
      - "--http.port=7070"
      - "--http.auth=true"
      - "--http.user=${I2PD_HTTP_USER:-i2pd}"
      - "--http.pass=${I2PD_HTTP_PASS:?Set I2PD_HTTP_PASS in .env before starting}"
      - "--http.hostname=${I2PD_BIND_IP:?Set I2PD_BIND_IP to this host's LAN IP in .env before starting}"
      - "--httpproxy.enabled=true"
      - "--httpproxy.address=0.0.0.0"
      - "--httpproxy.port=4444"
      - "--sam.enabled=true"
      - "--sam.address=0.0.0.0"
      - "--sam.port=7656"
    volumes:
      - ./i2pd:/home/i2pd/data
    ports:
      - "${I2PD_BIND_IP:?Set I2PD_BIND_IP to this host's LAN IP in .env before starting}:4444:4444"
      - "${I2PD_BIND_IP:?Set I2PD_BIND_IP to this host's LAN IP in .env before starting}:7070:7070"
      - "${I2PD_BIND_IP:?Set I2PD_BIND_IP to this host's LAN IP in .env before starting}:7656:7656"
