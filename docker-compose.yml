# Hardened i2pd router. Every published port is bound to 127.0.0.1 unless you
# opt in per service in .env. Read README.md before exposing anything.

services:
  i2pd:
    image: "${I2PD_IMAGE:-purplei2p/i2pd:release-2.60.0@sha256:7e2485270d274d9eaaa6240f8aaeac155b3af79967f44d1ba474c242a3653adb}"
    restart: unless-stopped
    # The image's i2pd user. The data directory must be owned by this uid:gid.
    user: "${I2PD_USER:-100:65533}"
    entrypoint: ["/bin/sh", "/etc/i2pd/entrypoint.sh"]
    command:
      - "--http.user=${I2PD_HTTP_USER:-i2pd}"
      # The console answers 403 unless the Host header is this name or address.
      - "--http.hostname=${I2PD_CONSOLE_HOSTNAME:-${I2PD_CONSOLE_BIND_IP:-127.0.0.1}}"
      - "--bandwidth=O"
      # Percent of the bandwidth limit offered to transit traffic. 0 = no transit.
      - "--share=${I2PD_SHARE:-50}"
    environment:
      # Published addresses, so the entrypoint can refuse wildcard binds.
      I2PD_PROXY_BIND_IP: "${I2PD_PROXY_BIND_IP:-127.0.0.1}"
      I2PD_CONSOLE_BIND_IP: "${I2PD_CONSOLE_BIND_IP:-127.0.0.1}"
      I2PD_SAM_BIND_IP: "${I2PD_SAM_BIND_IP:-127.0.0.1}"
      # "1" when a removed setting is still in .env. The values are never passed.
      I2PD_LEGACY_BIND_IP_SET: "${I2PD_BIND_IP:+1}"
      I2PD_LEGACY_HTTP_PASS_SET: "${I2PD_HTTP_PASS:+1}"
    secrets:
      - i2pd_http_pass
    volumes:
      # Router identity and state. The only writable bind mount.
      - "${I2PD_DATA_DIR:-./i2pd}:/home/i2pd/data"
      # i2pd.conf and entrypoint.sh (plus optional tunnels.conf / tunnels.d).
      - "./config:/etc/i2pd:ro"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      # Holds the generated config with the console password.
      - /run/i2pd:rw,noexec,nosuid,nodev,size=1m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: "${I2PD_MEM_LIMIT:-512m}"
    pids_limit: ${I2PD_PIDS_LIMIT:-256}
    cpus: ${I2PD_CPUS:-1.0}
    healthcheck:
      # Healthy only if the console demands credentials and SAM answers HELLO.
      test:
        - CMD-SHELL
        - >-
          printf 'GET / HTTP/1.0\r\n\r\n' | nc -w 3 127.0.0.1 7070 | head -n 1 | grep -q '^HTTP/1\.[01] 401'
          && printf 'HELLO VERSION MIN=3.0 MAX=3.3\n' | nc -w 3 127.0.0.1 7656 | grep -q '^HELLO REPLY RESULT=OK'
      # Each probe logs one auth failure and one SAM read error, so keep it slow.
      interval: 60s
      timeout: 10s
      retries: 3
      # i2pd opens the console and SAM only after its first reseed attempt.
      start_period: 120s
    ports:
      # HTTP proxy, no authentication.
      - "${I2PD_PROXY_BIND_IP:-127.0.0.1}:4444:4444"
      # Web console, HTTP Basic auth over plain HTTP.
      - "${I2PD_CONSOLE_BIND_IP:-127.0.0.1}:7070:7070"
      # SAM bridge, no authentication. Roughly shell-level access.
      - "${I2PD_SAM_BIND_IP:-127.0.0.1}:7656:7656"

secrets:
  i2pd_http_pass:
    file: "${I2PD_HTTP_PASS_FILE:-./secrets/i2pd_http_pass}"
