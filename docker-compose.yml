services:
  i2pd:
    image: "${I2PD_IMAGE:-purplei2p/i2pd:release-2.60.0@sha256:7e2485270d274d9eaaa6240f8aaeac155b3af79967f44d1ba474c242a3653adb}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - "--http.enabled=true"
      - "--http.address=0.0.0.0"
      - "--http.port=7070"
      - "--http.auth=true"
      - "--http.user=${I2PD_HTTP_USER:-i2pd}"
      - "--http.pass=${I2PD_HTTP_PASS:?Set I2PD_HTTP_PASS in .env before starting}"
      - "--http.hostname=${I2PD_BIND_IP:?Set I2PD_BIND_IP to this host's LAN IP in .env before starting}"
      - "--httpproxy.enabled=true"
      - "--httpproxy.address=0.0.0.0"
      - "--httpproxy.port=4444"
      - "--sam.enabled=true"
      - "--sam.address=0.0.0.0"
      - "--sam.port=7656"
    volumes:
      - ./i2pd:/home/i2pd/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'printf "GET / HTTP/1.0\r\n\r\n" | nc -w 2 127.0.0.1 7070 | grep -q "^HTTP/1\.[01] 401"'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "${I2PD_BIND_IP:?Set I2PD_BIND_IP to this host's LAN IP in .env before starting}:4444:4444"
      - "${I2PD_BIND_IP:?Set I2PD_BIND_IP to this host's LAN IP in .env before starting}:7070:7070"
      - "${I2PD_BIND_IP:?Set I2PD_BIND_IP to this host's LAN IP in .env before starting}:7656:7656"
