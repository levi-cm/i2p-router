## Base i2pd configuration for this Compose stack.
##
## This file is mounted read-only. config/entrypoint.sh copies it to a private
## tmpfs file, appends the web console password from the Compose secret, and
## starts i2pd with --conf pointing at that copy. Do not put a password here.
##
## Console username and hostname, bandwidth and transit share are passed on the
## command line by docker-compose.yml (most from .env). The command line wins,
## so setting them here has no effect. i2pd refuses to start on unknown
## options, so a typo here stops the container instead of being silently
## ignored.
##
## Reference: https://i2pd.readthedocs.io/en/latest/user-guide/configuration/

log = stdout
loglevel = warn

ipv4 = true
ipv6 = false

# Never act as a floodfill (netDb server) from a home or client box.
floodfill = false

[ntcp2]
enabled = true
published = true

[ssu2]
enabled = true
published = true

## Listener addresses stay 0.0.0.0 because published ports arrive on the
## container's eth0. Host exposure is decided only by `ports:` in
## docker-compose.yml, which binds every port to 127.0.0.1 by default.

[http]
enabled = true
address = 0.0.0.0
port = 7070
auth = true
# Reject requests whose Host header is not http.hostname (DNS rebinding).
strictheaders = true

[httpproxy]
enabled = true
address = 0.0.0.0
port = 4444
# No outproxy: the proxy only reaches .i2p destinations. Leave unset.
senduseragent = false

[socksproxy]
enabled = false

[sam]
enabled = true
address = 0.0.0.0
port = 7656

[bob]
enabled = false

[i2cp]
enabled = false

[i2pcontrol]
enabled = false

[upnp]
enabled = false

[reseed]
# Reseed HTTPS does not verify server certificates, so the SU3 signature is the
# only integrity check on bootstrap data. Signer certificates come from the
# image's read-only directory (--certsdir set by the entrypoint).
verify = true

[limits]
transittunnels = 2500
# Raise the soft open-files limit (1024 in most container runtimes). If the
# hard limit is lower, i2pd logs an error and keeps the runtime limit.
openfiles = 4096
